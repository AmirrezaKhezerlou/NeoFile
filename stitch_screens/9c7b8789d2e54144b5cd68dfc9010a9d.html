<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fb" rx="16"/>
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#1b1c1e">Windows Fluent File Extension Icon Pack</text>
  <text x="40" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#5f6368">Official Fluent styled badges and iconography for Android File Explorer</text>

  <!-- Row 1: Folder, PDF, Word, Excel -->
  <!-- 1. Windows Yellow Folder -->
  <g transform="translate(40, 100)">
    <rect width="140" height="150" rx="12" fill="#ffffff" stroke="#e2e4e9" stroke-width="1"/>
    <!-- Folder shape -->
    <path d="M42 35 C42 33 44 31 46 31 L64 31 C67 31 69 33 71 35 L76 41 L104 41 C107 41 109 43 109 46 L109 52 L42 52 Z" fill="#D98200"/>
    <rect x="36" y="46" width="68" height="52" rx="6" fill="#FFB900"/>
    <rect x="36" y="52" width="68" height="46" rx="5" fill="#FFC83B"/>
    <text x="70" y="118" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1b1c1e" text-anchor="middle">Folder</text>
    <text x="70" y="134" font-family="Segoe UI, sans-serif" font-size="11" fill="#74777f" text-anchor="middle">Directory</text>
  </g>

  <!-- 2. PDF Document -->
  <g transform="translate(200, 100)">
    <rect width="140" height="150" rx="12" fill="#ffffff" stroke="#e2e4e9" stroke-width="1"/>
    <rect x="44" y="32" width="52" height="66" rx="6" fill="#F40F02"/>
    <path d="M80 32 L96 48 L80 48 Z" fill="#B30C00"/>
    <!-- PDF badge -->
    <rect x="34" y="66" width="42" height="20" rx="4" fill="#B30C00"/>
    <text x="55" y="80" font-family="Segoe UI, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">PDF</text>
    <line x1="52" y1="50" x2="72" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="52" y1="58" x2="66" y2="58" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="70" y="118" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1b1c1e" text-anchor="middle">.pdf</text>
    <text x="70" y="134" font-family="Segoe UI, sans-serif" font-size="11" fill="#74777f" text-anchor="middle">Acrobat Doc</text>
  </g>

  <!-- 3. Word Document (DOCX) -->
  <g transform="translate(360, 100)">
    <rect width="140" height="150" rx="12" fill="#ffffff" stroke="#e2e4e9" stroke-width="1"/>
    <rect x="44" y="32" width="52" height="66" rx="6" fill="#185ABD"/>
    <path d="M80 32 L96 48 L80 48 Z" fill="#103F80"/>
    <rect x="32" y="62" width="30" height="28" rx="4" fill="#103F80"/>
    <text x="47" y="81" font-family="Segoe UI, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">W</text>
    <line x1="68" y1="68" x2="86" y2="68" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="68" y1="74" x2="84" y2="74" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="68" y1="80" x2="80" y2="80" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="70" y="118" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1b1c1e" text-anchor="middle">.docx / .doc</text>
    <text x="70" y="134" font-family="Segoe UI, sans-serif" font-size="11" fill="#74777f" text-anchor="middle">Word Document</text>
  </g>

  <!-- 4. Excel Spreadsheet (XLSX) -->
  <g transform="translate(520, 100)">
    <rect width="140" height="150" rx="12" fill="#ffffff" stroke="#e2e4e9" stroke-width="1"/>
    <rect x="44" y="32" width="52" height="66" rx="6" fill="#107C41"/>
    <path d="M80 32 L96 48 L80 48 Z" fill="#0B552C"/>
    <rect x="32" y="62" width="30" height="28" rx="4" fill="#0B552C"/>
    <text x="47" y="81" font-family="Segoe UI, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">X</text>
    <line x1="68" y1="68" x2="86" y2="68" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="68" y1="74" x2="86" y2="74" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="68" y1="80" x2="82" y2="80" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="70" y="118" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1b1c1e" text-anchor="middle">.xlsx / .csv</text>
    <text x="70" y="134" font-family="Segoe UI, sans-serif" font-size="11" fill="#74777f" text-anchor="middle">Spreadsheet</text>
  </g>

  <!-- Row 2: PowerPoint, ZIP/Archive, APK, Audio/Video -->
  <!-- 5. PowerPoint (PPTX) -->
  <g transform="translate(40, 275)">
    <rect width="140" height="150" rx="12" fill="#ffffff" stroke="#e2e4e9" stroke-width="1"/>
    <rect x="44" y="32" width="52" height="66" rx="6" fill="#C43E1C"/>
    <path d="M80 32 L96 48 L80 48 Z" fill="#882B13"/>
    <rect x="32" y="62" width="30" height="28" rx="4" fill="#882B13"/>
    <text x="47" y="81" font-family="Segoe UI, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">P</text>
    <circle cx="76" cy="72" r="6" stroke="#ffffff" stroke-width="2"/>
    <text x="70" y="118" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1b1c1e" text-anchor="middle">.pptx</text>
    <text x="70" y="134" font-family="Segoe UI, sans-serif" font-size="11" fill="#74777f" text-anchor="middle">Presentation</text>
  </g>

  <!-- 6. Archive (ZIP / RAR) -->
  <g transform="translate(200, 275)">
    <rect width="140" height="150" rx="12" fill="#ffffff" stroke="#e2e4e9" stroke-width="1"/>
    <path d="M42 35 C42 33 44 31 46 31 L64 31 C67 31 69 33 71 35 L76 41 L104 41 C107 41 109 43 109 46 L109 52 L42 52 Z" fill="#7A4B96"/>
    <rect x="36" y="46" width="68" height="52" rx="6" fill="#9B59B6"/>
    <!-- Zipper design -->
    <rect x="66" y="46" width="8" height="34" fill="#5E3378"/>
    <line x1="66" y1="52" x2="74" y2="52" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="66" y1="58" x2="74" y2="58" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="66" y1="64" x2="74" y2="64" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="65" y="74" width="10" height="14" rx="2" fill="#FFC83B"/>
    <text x="70" y="118" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1b1c1e" text-anchor="middle">.zip / .rar / .7z</text>
    <text x="70" y="134" font-family="Segoe UI, sans-serif" font-size="11" fill="#74777f" text-anchor="middle">Compressed</text>
  </g>

  <!-- 7. Android Package (APK) -->
  <g transform="translate(360, 275)">
    <rect width="140" height="150" rx="12" fill="#ffffff" stroke="#e2e4e9" stroke-width="1"/>
    <rect x="44" y="32" width="52" height="66" rx="6" fill="#3DDC84"/>
    <path d="M80 32 L96 48 L80 48 Z" fill="#2AA763"/>
    <!-- Android head -->
    <path d="M60 62 A 10 10 0 0 1 80 62 Z" fill="#ffffff"/>
    <circle cx="66" cy="59" r="1.5" fill="#3DDC84"/>
    <circle cx="74" cy="59" r="1.5" fill="#3DDC84"/>
    <line x1="63" y1="52" x2="60" y2="48" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="77" y1="52" x2="80" y2="48" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="34" y="74" width="38" height="18" rx="4" fill="#2AA763"/>
    <text x="53" y="86" font-family="Segoe UI, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">APK</text>
    <text x="70" y="118" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1b1c1e" text-anchor="middle">.apk</text>
    <text x="70" y="134" font-family="Segoe UI, sans-serif" font-size="11" fill="#74777f" text-anchor="middle">Android App</text>
  </g>

  <!-- 8. Media / Code (.mp4, .jpg, .code) -->
  <g transform="translate(520, 275)">
    <rect width="140" height="150" rx="12" fill="#ffffff" stroke="#e2e4e9" stroke-width="1"/>
    <rect x="44" y="32" width="52" height="66" rx="6" fill="#0078D4"/>
    <path d="M80 32 L96 48 L80 48 Z" fill="#005A9E"/>
    <!-- Play / Image icon -->
    <circle cx="70" cy="65" r="14" fill="#005A9E"/>
    <polygon points="67,59 76,65 67,71" fill="#ffffff"/>
    <text x="70" y="118" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1b1c1e" text-anchor="middle">.mp4 / .mkv</text>
    <text x="70" y="134" font-family="Segoe UI, sans-serif" font-size="11" fill="#74777f" text-anchor="middle">Video & Media</text>
  </g>
</svg>
